<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hide AI Overview for Google</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>Hide AI Overview for Google</h1>
    </header>

    <p class="status" id="status">AI answers are hidden.</p>

    <label class="toggle-row" for="enabled-toggle">
      <span>Hide AI Overviews</span>
      <span class="switch">
        <input type="checkbox" id="enabled-toggle" />
        <span class="slider" aria-hidden="true"></span>
      </span>
    </label>

    <div class="section">
      <p class="section-label">Advanced</p>
      <label class="toggle-row toggle-row--secondary" for="reduce-flash-toggle">
        <span>Prevent flash</span>
        <span class="switch">
          <input type="checkbox" id="reduce-flash-toggle" />
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
    </div>

    <footer class="footer">
      <a href="https://github.com/medaharrat/google-classic-search/issues" target="_blank" rel="noopener">Help &amp; feedback</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
