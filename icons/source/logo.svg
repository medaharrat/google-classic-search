<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#324066"/>
      <stop offset="100%" stop-color="#171F38"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>

  <!-- Magnifying glass: handle (drawn first so ring sits on top) -->
  <rect x="0" y="0" width="14" height="40" rx="7"
        fill="#F4F6FB"
        transform="translate(78 78) rotate(45)"/>

  <!-- Magnifying glass: lens ring -->
  <circle cx="52" cy="52" r="30" fill="none" stroke="#F4F6FB" stroke-width="11"/>

  <!-- "AI off" cue: small four-point sparkle, crossed out -->
  <g transform="translate(93 30)">
    <path d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z"
          fill="#F2A65A"/>
    <line x1="-11" y1="11" x2="11" y2="-11" stroke="#E4572E" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
