<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFEFF"/>
      <stop offset="55%" stop-color="#EAF2FF"/>
      <stop offset="100%" stop-color="#CFE3FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#2158D0"/>
    </linearGradient>
  </defs>

  <!-- Badge: rounded square, real alpha outside it -->
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#badgeBg)"/>

  <!-- Magnifying glass handle -->
  <line x1="72" y1="131" x2="22" y2="180" stroke="url(#glass)" stroke-width="26" stroke-linecap="round"/>

  <!-- Magnifying glass lens ring -->
  <circle cx="104" cy="98" r="46" fill="#FFFFFF" stroke="url(#glass)" stroke-width="22"/>

  <!-- "No AI" mark: simplified to a plain red prohibition dot, legible at 16-32px -->
  <circle cx="182" cy="170" r="42" fill="#E43D30"/>
  <line x1="160" y1="148" x2="204" y2="192" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
</svg>
