<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFEFF"/>
      <stop offset="55%" stop-color="#EAF2FF"/>
      <stop offset="100%" stop-color="#CFE3FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FA0FF"/>
      <stop offset="100%" stop-color="#1E6DE0"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1B2E5C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#badgeBg)" filter="url(#softShadow)"/>

  <!-- Handle -->
  <line x1="288" y1="524" x2="88" y2="720" stroke="url(#glass)" stroke-width="88" stroke-linecap="round"/>
  <!-- Lens -->
  <circle cx="416" cy="392" r="184" fill="#FFFFFF" stroke="url(#glass)" stroke-width="88"/>
  <!-- Simplified "no AI" mark: plain red dot with white slash, legible at 16-32px -->
  <circle cx="728" cy="680" r="168" fill="#E8231E"/>
  <line x1="640" y1="592" x2="816" y2="768" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
</svg>
